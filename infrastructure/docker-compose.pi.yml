# Monitoring on a Raspberry Pi, where the ADS-B services are systemd units
# bound to 127.0.0.1.
#
#     docker compose -f docker-compose.yml -f docker-compose.pi.yml up -d prometheus grafana
#
# Why a separate override rather than opening the services' binds:
#
# A container reaching the host through host-gateway is NOT loopback, so
# scraping that way means every service has to listen beyond 127.0.0.1. For the
# feed client that is merely a counters endpoint with no authentication. For the
# weather service it is worse: the same port carries `PUT /v1/enabled`, also
# unauthenticated, so anything on the LAN could pause the weather layer. And the
# data server's bind is hardcoded to loopback, so it could not be scraped that
# way at all.
#
# Putting Prometheus on the host network instead makes every target
# `localhost:<port>` and nothing has to be opened. Linux only -- which is
# exactly where the Pi is.
#
# Grafana is deliberately NOT on the host network: it only needs to reach
# Prometheus, and publishing :3000 is enough.

services:
  prometheus:
    network_mode: host
    # host networking ignores `ports:`; Prometheus binds :9090 on the host
    # directly. The compose network is unavailable here, hence its own config.
    ports: !override []
    networks: !override []
    volumes:
      - ./prometheus/prometheus.pi.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    # Prometheus is no longer a compose-network service, so reach it on the
    # host, and drop the healthcheck dependency that no longer resolves.
    depends_on: !override []
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_DEFAULT_THEME=dark
