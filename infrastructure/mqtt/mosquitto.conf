# Mosquitto config for the ADS-B edge bus.

listener 1883
protocol mqtt

# Open by design: this is a LAN-local bus between the feed client, the recorder
# and the desktop app. Do NOT expose port 1883 beyond the LAN.
#
# This cannot currently be tightened here alone: the Rust clients have no
# username/password settings, so `allow_anonymous false` locks THEM out too.
# Adding credentials means adding the config fields and calling
# MqttOptions::set_credentials on both ends first. Until then, the trust
# boundary is the network segment.
allow_anonymous true

# The ADS-B feed is a live stream: a subscriber that was not connected has
# missed nothing it can use, so persistence buys nothing and costs SD-card
# writes on a Pi. Durability is adsb-data-server's job, in DuckDB.
persistence false

# Aircraft position updates are small and frequent; the default 100 is enough
# headroom for a busy receiver without letting a stalled subscriber balloon
# broker memory.
max_queued_messages 100

log_dest stdout
log_type warning
log_type error
connection_messages true
