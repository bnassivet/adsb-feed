[project]
name = "adsb-agent"
version = "0.1.0"
description = "AG-UI agent service for ADS-B Aircraft Tracker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "ag-ui-protocol>=0.1",
    "openai>=1.60",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "mlflow-tracing>=3.12",
    # Prometheus exposition. A runtime dependency, not a dev one: /metrics is
    # part of what the service serves. MLflow tracing is richer per run, but it
    # is sampled, it is another service that can be down -- and when it is, this
    # agent hangs at startup -- and it does not alert.
    "prometheus-client>=0.21",
    "boto3>=1.35",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "httpx>=0.28",
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
]

[project.optional-dependencies]
# The evaluation harness (eval/): datasets, scorers, `mlflow.genai.evaluate`.
# Needs the FULL mlflow; the service itself runs on the slim `mlflow-tracing`
# in the base dependencies. Since MLflow 3.18 the full package depends on
# `mlflow-tracing` at the same version, so the two share one environment.
eval = [
    "mlflow>=3.18",
]
dev = [
    "pytest>=8",
    "httpx>=0.28",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
    "langgraph-cli[inmem]>=0.2",
]
voice = [
    "sounddevice>=0.5",
    "numpy>=2.0",
    "llama-cpp-python>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adsb_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Scripts run as files put eval/ on sys.path before importing the shared modules.
"eval/fastpath_agent/*.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
