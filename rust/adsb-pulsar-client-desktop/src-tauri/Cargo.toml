[package]
name = "adsb-pulsar-client-desktop"
version = "0.1.0"
edition = "2024"
description = "ADS-B Aircraft Tracker Desktop Application"
authors = ["ADS-B Project Contributors"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = "0.8"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
# `mqtt` is a direct requirement: bridge.rs constructs MqttSource unconditionally.
# It used to arrive only by feature unification through adsb-data-server, so
# dropping that crate's dependency would have broken this build from a distance.
adsb-pulsar-client = { path = "../../adsb-pulsar-client", default-features = false, features = ["mqtt"] }
adsb-data-engine = { path = "../../adsb-data-engine" }
# Query surface shared with the headless daemon: same answers from the desktop
# app, the agent tool server and adsb-data-server. No clap, no MQTT here.
adsb-data-server = { path = "../../adsb-data-server", default-features = false, features = ["http-api", "web-lookup"] }
# The weather service's wire types, plus its control-API client for the "Fetch
# weather" switch: no publisher, no refresh loop, no Open-Meteo provider. The
# weather service itself is a separate binary.
adsb-weather-server = { path = "../../adsb-weather-server", default-features = false, features = ["client"] }
# The OpenSky gap filler's payload types and control-API client; no poller, no OAuth.
adsb-opensky-server = { path = "../../adsb-opensky-server", default-features = false, features = ["client"] }
# OpenAIP airspace downloads (airspace.rs). Same version and TLS stack as the
# rest of the workspace, so this adds no second reqwest.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# Météo-France radar mosaics (radar_grid.rs): ODIM_H5 read in pure Rust (no
# libhdf5), rendered to PNG. png and base64 are the versions Tauri already pulls in.
hdf5-reader = { version = "0.13", default-features = false }
png = "0.17"
base64 = "0.22"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"

[lib]
name = "adsb_pulsar_client_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "adsb-pulsar-client-desktop"
path = "src/main.rs"
