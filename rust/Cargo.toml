[workspace]
members = ["adsb-pulsar-client", "adsb-data-engine", "adsb-data-server", "adsb-weather-server", "adsb-opensky-server", "adsb-pulsar-client-desktop/src-tauri"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.39", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2.0"
anyhow = "1.0"
chrono = "0.4"
chrono-tz = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Radar mosaics (desktop radar_grid.rs) are 3472×3472 gzip-chunked HDF5 and a
# 1200×1200 PNG: unoptimised, decode + encode take ~0.5 s per image under
# `tauri dev`. Optimise only these dependencies in dev builds.
[profile.dev.package.hdf5-reader]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
