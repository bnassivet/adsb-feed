[project]
name = "adsb-simulation-agent"
version = "0.1.0"
description = "A2A agent that generates kinematically plausible simulated flight trajectories for the ADS-B desktop app"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "langgraph>=1.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "a2a-sdk[http-server]>=1.1",
    "uvicorn>=0.34",
    "mlflow-tracing>=3.12",
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adsb_simulation_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
