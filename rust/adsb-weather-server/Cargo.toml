[package]
name = "adsb-weather-server"
version = "0.1.0"
edition = "2024"
authors = ["bruno.nassivet@gmail.com"]
description = "Weather service: gridded winds aloft and MSL pressure from Open-Meteo, published over MQTT"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Service side (optional). A consumer that only needs the payload types -- the
# desktop app -- depends on this crate with `default-features = false` and never
# builds an HTTP client or a TLS stack.
async-trait = { version = "0.1", optional = true }
# rustls only: no OpenSSL to find on a Raspberry Pi image. `default-features =
# false` also drops http2 and the system proxy lookup, neither of which a single
# API endpoint needs.
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
# Retry pacing shared with the feed client. `default-features = false` drops
# clap and pulsar, so this crate never needs protoc.
adsb-pulsar-client = { path = "../adsb-pulsar-client", default-features = false, features = ["mqtt"], optional = true }
# Same version and feature set as adsb-pulsar-client: one copy in the build, and
# no TLS stack for a plain-text LAN hop.
rumqttc = { version = "0.25", default-features = false, optional = true }
# Retry jitter. Dependency-free, and already in the lockfile through tempfile.
fastrand = { version = "2", optional = true }
# Control API server (enable/disable, status). Same major as adsb-data-server.
axum = { version = "0.8", optional = true }
# The control API's OpenAPI document, generated from the handlers and the
# contract types rather than written by hand, so it cannot drift from them.
utoipa = { version = "5", optional = true }
utoipa-axum = { version = "0.2", optional = true }
# Swagger UI. `vendored`: the UI assets come from a crate instead of a download
# in build.rs, so offline and arm64 Docker builds keep working.
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"], optional = true }
# Prometheus exposition. `default-features = false` for the same reason as in
# adsb-pulsar-client: the default `protobuf` feature pulls protobuf 2.x.
prometheus = { version = "0.13", default-features = false, optional = true }

# CLI + layered config (optional, for the binary)
clap = { version = "4.5", features = ["derive", "env"], optional = true }
toml = { version = "0.8", optional = true }
tracing-subscriber = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }

[dev-dependencies]
axum = "0.8"
tempfile = "3"
# test-util: paused clock, so back-off timing is asserted exactly and instantly.
tokio = { workspace = true, features = ["test-util"] }

[features]
# `client` is a default so `cargo test --workspace` runs the control API's
# integration tests, which drive the server through it. The desktop builds with
# `default-features = false` and picks `client` alone.
default = ["cli", "client"]
service = [
    "dep:async-trait",
    "dep:reqwest",
    "dep:tokio",
    "dep:tracing",
    "dep:adsb-pulsar-client",
    "dep:rumqttc",
    "dep:fastrand",
]
# OpenAPI schemas on the contract types. Kept apart from `client`, so the
# desktop never compiles utoipa.
openapi = ["dep:utoipa"]
# The control API server, with its OpenAPI document at /v1/openapi.json.
http-api = ["service", "openapi", "dep:axum", "dep:utoipa-axum"]
# Swagger UI at /swagger-ui/, over the same document.
swagger-ui = ["http-api", "dep:utoipa-swagger-ui"]
# Prometheus exposition at /metrics, on the control API's own listener. The
# desktop builds `client` alone and never compiles this.
metrics = ["http-api", "adsb-pulsar-client/metrics", "dep:prometheus"]
# A client for the control API and nothing else: what the desktop builds.
client = ["dep:reqwest"]
cli = ["service", "http-api", "swagger-ui", "metrics", "dep:clap", "dep:toml", "dep:tracing-subscriber", "dep:anyhow"]

[lib]
name = "adsb_weather_server"
path = "src/lib.rs"

[[bin]]
name = "adsb-weather-server"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "open_meteo_provider"
required-features = ["service"]

[[test]]
name = "control_api"
required-features = ["http-api", "client"]

[[test]]
name = "openapi"
required-features = ["swagger-ui", "client", "metrics"]

[[test]]
name = "metrics_api"
required-features = ["metrics", "client"]
