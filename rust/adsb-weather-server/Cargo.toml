[package]
name = "adsb-weather-server"
version = "0.1.0"
edition = "2024"
authors = ["bruno.nassivet@gmail.com"]
description = "Weather service: gridded winds aloft and MSL pressure from Open-Meteo, published over MQTT"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Service side (optional). A consumer that only needs the payload types -- the
# desktop app -- depends on this crate with `default-features = false` and never
# builds an HTTP client or a TLS stack.
async-trait = { version = "0.1", optional = true }
# rustls only: no OpenSSL to find on a Raspberry Pi image. `default-features =
# false` also drops http2 and the system proxy lookup, neither of which a single
# API endpoint needs.
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
# Reconnect/retry pacing and the MQTT client. `default-features = false` drops
# clap and pulsar, so this crate never needs protoc.
adsb-pulsar-client = { path = "../adsb-pulsar-client", default-features = false, features = ["mqtt"], optional = true }

[dev-dependencies]
axum = "0.8"
tempfile = "3"
# test-util: paused clock, so back-off timing is asserted exactly and instantly.
tokio = { workspace = true, features = ["test-util"] }

[features]
default = ["service"]
service = [
    "dep:async-trait",
    "dep:reqwest",
    "dep:tokio",
    "dep:tracing",
    "dep:adsb-pulsar-client",
]

[lib]
name = "adsb_weather_server"
path = "src/lib.rs"

[[test]]
name = "open_meteo_provider"
required-features = ["service"]
