# TEMPLATE -- copy me, do not edit me.
#
#     make config     # writes adsb-stack.toml (refuses to clobber an existing one)
#
# `adsb-stack.toml` is your machine's configuration and is gitignored, for the
# same reasons a .env is: it holds host-specific paths, your receiver's real
# location and a Quack token. This template is the tracked, shareable version --
# change it only when adding a setting everyone should get.
#
# From adsb-stack.toml, `make render` generates .run/feed.toml and
# .run/data-server.toml, which the binaries read via --config. Those are
# derived: never edit them either.
#
# One file rather than two because source_id and the MQTT broker/port/topic are
# needed by *both* binaries. Kept in two hand-edited files they drift, and the
# failure is silent -- a feed publishing to one topic while the recorder
# subscribes to another looks healthy from both sides and records nothing.

[receiver]
# Stamped onto every stored record, and the MQTT client id derives from it.
# Must be unique per node: duplicates make data unattributable, and brokers
# evict a session when a second client connects with the same id.
#
# Convention: `<host-or-site>-<stage>`, stage being dev / prod. The stage is
# half of the identity -- without it, this dev stack and a deployed fleet on
# the same LAN take the same client ids and evict each other in a loop. Pair it
# with a matching mqtt.topic below; `make doctor` warns when they disagree.
#
# Pointing this machine at a fleet? Give it its OWN id. A desktop subscribing
# to the bus takes the client id `<id>-sub`, which is already the recorder's if
# you reuse the recorder's id -- and they will evict each other. See
# deploy/README.md.
id = "dev-laptop-dev"
# Your antenna's real position: used as the map centre, for distance and
# detection-range calculations, and as the origin for the mock feed.
latitude = 46.717915
longitude = -2.33716964
altitude_ft = 20.0
# Timezone of the dump1090 timestamps: "Local" or an IANA name.
timezone = "Local"

[dump1090]
host = "127.0.0.1"
port = 30003
# true: `make up` starts the bundled mock feed (6 aircraft orbiting the receiver)
# instead of expecting a real dump1090. Useful with no receiver attached.
mock = true

[mqtt]
host = "localhost"
port = 1883
# Stage-scoped, matching receiver.id above. This is the stronger of the two
# isolation guards: distinct ids stop clients evicting each other, but only a
# distinct topic stops a dev feed writing into a prod recorder's database.
topic = "adsb/dev/sbs/raw"
# 0 = at most once. Right for a live feed: a subscriber that was not connected
# has missed nothing it can still use, and durability is the recorder's job.
qos = 0

[storage]
# Dev-local. The deployed Pi uses /var/lib/adsb/adsb.db via /etc/adsb/*.toml.
db_path = ".run/adsb.db"
# Read-only JSON query API. 0 disables.
http_port = 8787
# Expose the database over Quack so the desktop app (and duckdb CLI, webapp,
# spark) can ATTACH while the recorder keeps writing.
#
# The token grants full read AND write on every table and the server terminates
# no TLS. Fine on a trusted LAN; never port-forward it.
share = true
share_uri = "quack:localhost:9494"
# Change this. Anyone who can reach the port and knows it has full read AND
# write on every table.
share_token = "dev-token"
checkpoint_secs = 300
# 0 keeps everything.
retention_hours = 0

[pulsar]
# Off by default -- the whole point of the MQTT path. Enable to also feed the
# Spark/Delta analytics pipeline, which needs infrastructure/docker-compose.yml.
enabled = false
broker = "pulsar://localhost:6650"
topic = "persistent://kradsb/adsb/sbs-topic"

[agents]
# `make up-agents` starts these. They need an LLM endpoint (see llm_base_url);
# `make doctor` reports if it is unreachable.
enabled = false
agent_port = 8000
sim_agent_port = 8300
llm_base_url = "http://localhost:1234/v1"
# MLflow tracing. Both agents resolve their experiment at IMPORT time and retry
# a refused connection several times with backoff, so an MLflow that is down
# makes them HANG at startup -- no port, no log output, reading exactly like
# "the agents will not start". `make doctor` checks it.
mlflow_uri = "http://localhost:5010"

[desktop]
# The Next dev server. Pinned to 3000 in tauri.conf.json, so a SECOND stack
# running its desktop at the same time needs a different one here -- and gets a
# matching CSP entry automatically, without which its agent calls are blocked
# with nothing but a console message.
dev_port = 3000

# The desktop's OWN read-only tool server for the agent, serving its own
# storage. Must not collide with storage.http_port above, which the data server
# owns: whichever starts second fails to bind and its history tools are silently
# disabled. (Was agents.desktop_tool_port, which still works.)
tool_port = 8788

[remote]
# For `make remote`: run the desktop app against a data server on another host
# (typically a Raspberry Pi) instead of recording locally. Leave uri empty for
# the all-local topology.
uri = ""
token = ""
