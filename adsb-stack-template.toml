# TEMPLATE -- copy me, do not edit me.
#
#     make config     # writes adsb-stack.toml (refuses to clobber an existing one)
#
# `adsb-stack.toml` is your machine's configuration and is gitignored, for the
# same reasons a .env is: it holds host-specific paths, your receiver's real
# location and a Quack token. This template is the tracked, shareable version --
# change it only when adding a setting everyone should get.
#
# From adsb-stack.toml, `make render` generates .run/feed.toml and
# .run/data-server.toml, which the binaries read via --config. Those are
# derived: never edit them either.
#
# One file rather than two because source_id and the MQTT broker/port/topic are
# needed by *both* binaries. Kept in two hand-edited files they drift, and the
# failure is silent -- a feed publishing to one topic while the recorder
# subscribes to another looks healthy from both sides and records nothing.

[receiver]
# Stamped onto every stored record, and the MQTT client id derives from it.
# Must be unique per node: duplicates make data unattributable, and brokers
# evict a session when a second client connects with the same id.
#
# Convention: `<host-or-site>-<stage>`, stage being dev / prod. The stage is
# half of the identity -- without it, this dev stack and a deployed fleet on
# the same LAN take the same client ids and evict each other in a loop. Pair it
# with a matching mqtt.topic below; `make doctor` warns when they disagree.
#
# Pointing this machine at a fleet? Give it its OWN id. A desktop subscribing
# to the bus takes the client id `<id>-sub`, which is already the recorder's if
# you reuse the recorder's id -- and they will evict each other. See
# deploy/README.md.
id = "dev-laptop-dev"
# Your antenna's real position: used as the map centre, for distance and
# detection-range calculations, and as the origin for the mock feed.
latitude = 46.717915
longitude = -2.33716964
altitude_ft = 20.0
# Timezone of the dump1090 timestamps: "Local" or an IANA name.
timezone = "Local"

[dump1090]
host = "127.0.0.1"
port = 30003
# true: `make up` starts the bundled mock feed (6 aircraft orbiting the receiver)
# instead of expecting a real dump1090. Useful with no receiver attached.
mock = true

[mqtt]
host = "localhost"
port = 1883
# Stage-scoped, matching receiver.id above. This is the stronger of the two
# isolation guards: distinct ids stop clients evicting each other, but only a
# distinct topic stops a dev feed writing into a prod recorder's database.
topic = "adsb/dev/sbs/raw"
# 0 = at most once. Right for a live feed: a subscriber that was not connected
# has missed nothing it can still use, and durability is the recorder's job.
qos = 0

[storage]
# Dev-local. The deployed Pi uses /var/lib/adsb/adsb.db via /etc/adsb/*.toml.
db_path = ".run/adsb.db"
# Read-only JSON query API, and the recorder's /metrics. 0 disables both.
http_port = 8787
# No authentication, so it stays on this machine unless you say otherwise.
# "0.0.0.0" is for reaching it from another host -- an agent or a Prometheus
# elsewhere on a trusted LAN. On a Raspberry Pi prefer
# infrastructure/docker-compose.pi.yml, which scrapes over loopback instead.
http_bind = "127.0.0.1"
# Expose the database over Quack so the desktop app (and duckdb CLI, webapp,
# spark) can ATTACH while the recorder keeps writing.
#
# The token grants full read AND write on every table and the server terminates
# no TLS. Fine on a trusted LAN; never port-forward it.
share = true
share_uri = "quack:localhost:9494"
# Change this. Anyone who can reach the port and knows it has full read AND
# write on every table.
share_token = "dev-token"
checkpoint_secs = 300
# 0 keeps everything.
retention_hours = 0

[pulsar]
# Off by default -- the whole point of the MQTT path. Enable to also feed the
# Spark/Delta analytics pipeline, which needs infrastructure/docker-compose.yml.
enabled = false
broker = "pulsar://localhost:6650"
topic = "persistent://kradsb/adsb/sbs-topic"

[weather]
# Winds aloft and mean-sea-level pressure around the receiver, fetched from
# Open-Meteo and published as ONE retained MQTT message. The desktop draws it as
# a map layer when its live source is MQTT.
#
# Off by default: it needs outbound internet, and a node without an uplink would
# only log retries. Open-Meteo's free tier is non-commercial and capped at
# 10,000 calls/day, 5,000/hour and 600/minute, counted per grid point; the
# service logs its own estimate at startup (`make logs N=weather`), paces its
# requests under the per-minute limit, and waits out a limit it runs into
# rather than retrying into it. These defaults use about 6,700 a day.
enabled = false
# Leave unset to derive it from mqtt.topic: adsb/<stage>/sbs/raw becomes
# adsb/<stage>/weather/grid. The desktop applies the same rule, so the two
# cannot drift. Set it only to publish somewhere else on purpose.
# topic = "adsb/dev/weather/grid"
# The grid is centred on [receiver]. Longitude spacing widens with latitude, so
# ±300 NM at 1° is 11 x 17 = 187 points at 47°N.
radius_nm = 300
spacing_deg = 1.0
# hPa, roughly FL050 / FL100 / FL180 / FL300 / FL340 / FL390. Each level adds two
# variables per point, and a request for more than 10 variables costs extra.
levels = [850, 700, 500, 300, 250, 200]
refresh_minutes = 60
# best_match lets Open-Meteo choose. A specific model (see open-meteo.com/en/docs)
# can be finer over one region.
model = "best_match"
# The last good grid survives restarts here, so a node whose uplink is down
# still publishes something. Stack-scoped, like storage.db_path.
cache_path = ".run/weather-cache.json"
# Control API: `make weather-status | weather-enable | weather-disable`, and the
# desktop's "Fetch weather" switch. Disabling pauses fetching only; the last
# grid stays on the map. Status is also published, retained, next to the grid
# topic (.../weather/status and .../weather/availability). 0 disables the API.
# Browse and try it at http://127.0.0.1:8789/swagger-ui/ (OpenAPI document:
# /v1/openapi.json).
http_port = 8789
# No authentication. Loopback keeps it to this machine; set "0.0.0.0" only on a
# trusted LAN, e.g. so a desktop on another machine can use the switch.
http_bind = "127.0.0.1"
# The enabled setting and any rate-limit deadline survive restarts here, so a
# node disabled before a reboot stays disabled. Stack-scoped, like cache_path.
state_path = ".run/weather-state.json"

[metrics]
# Prometheus scrape endpoints. The recorder, the weather service and the two
# agents serve /metrics on ports they already have (storage.http_port 8787,
# weather.http_port 8789, agents 8000/8300); only the feed client has no
# listener of its own, so it gets one here. 0 disables it.
#
# Start Prometheus and Grafana with `make monitoring`.
feed_port = 8790
# Counters only -- no secrets, no control -- but still a listener with no
# authentication, so it stays on loopback.
#
# Loopback is enough for `make monitoring` on macOS and Windows: Docker Desktop
# proxies host.docker.internal through to the host's 127.0.0.1, so a
# loopback-bound endpoint is scraped fine (measured -- the recorder and weather
# targets come up on 127.0.0.1 too). Where the Docker host is LINUX,
# host-gateway is a real bridge address that cannot reach host loopback, and a
# target would need "0.0.0.0" here -- but on a Raspberry Pi prefer
# infrastructure/docker-compose.pi.yml, which puts Prometheus on the host
# network so nothing has to be opened at all.
feed_bind = "127.0.0.1"

[agents]
# `make up-agents` starts these. They need an LLM endpoint (see llm_base_url);
# `make doctor` reports if it is unreachable.
enabled = false
agent_port = 8000
sim_agent_port = 8300
# The MLflow AI Gateway, NOT LM Studio directly. The gateway resolves the
# short endpoint name (gemma-4-12b-qat) and loads the model on demand;
# pointed straight at LM Studio you need the full id (google/gemma-4-12b-qat)
# AND a model already loaded, or every turn fails with a 400.
#
# NOTE this value is exported to the agents, so it OVERRIDES
# ADSB_AGENT_LLM_BASE_URL in rust/adsb-agent/.env.
llm_base_url = "http://localhost:5010/gateway/mlflow/v1"
# MLflow tracing. Both agents resolve their experiment at IMPORT time and retry
# a refused connection several times with backoff, so an MLflow that is down
# makes them HANG at startup -- no port, no log output, reading exactly like
# "the agents will not start". `make doctor` checks it.
mlflow_uri = "http://localhost:5010"

[desktop]
# The Next dev server. Pinned to 3200 in tauri.conf.json AND package.json, so a
# SECOND stack running its desktop at the same time needs a different one here
# -- and gets a matching CSP entry automatically, without which its agent calls
# are blocked with nothing but a console message.
#
# 3200, not Next's usual 3000: Grafana owns :3000 in
# infrastructure/docker-compose.yml, and the two used to collide.
dev_port = 3200

# The desktop's OWN read-only tool server for the agent, serving its own
# storage. Must not collide with storage.http_port above, which the data server
# owns: whichever starts second fails to bind and its history tools are silently
# disabled. (Was agents.desktop_tool_port, which still works.)
tool_port = 8788

[remote]
# For `make remote`: run the desktop app against a data server on another host
# (typically a Raspberry Pi) instead of recording locally. Leave uri empty for
# the all-local topology.
uri = ""
token = ""
